# ADHIKAR LawBridge India - Spring Boot Configuration
server.port=8080

# OpenRouter API Key for Vidhi Sahayak Chatbot (set via OPENROUTER_API_KEY env or configure here)
openrouter.api.key=${OPENROUTER_API_KEY:your_openrouter_api_key_here}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions

# Jackson
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.adhikar=DEBUG
spring.application.name=adhikar-lawbridge
